<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Boards – बिहार बोर्ड MCQ प्रैक्टिस</title>
<style>
:root{--bg:#f2f5fa;--ink:#0f172a;--mut:#475569;--card:#fff;--line:#c7d0de;--pri:#0b3d91;--onpri:#fff;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--skip:#e2e8f0;--hi:#facc15;--hiink:#1c1400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1020;--ink:#e8eefc;--mut:#a3b1c9;--card:#131c30;--line:#2f3d59;--pri:#7aa7ff;--onpri:#06122b;--ok:#4ade80;--okbg:#0f3a21;--bad:#f87171;--badbg:#431616;--skip:#1f2a44}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1020;--ink:#e8eefc;--mut:#a3b1c9;--card:#131c30;--line:#2f3d59;--pri:#7aa7ff;--onpri:#06122b;--ok:#4ade80;--okbg:#0f3a21;--bad:#f87171;--badbg:#431616;--skip:#1f2a44}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Noto Sans Devanagari","Mangal","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
header{background:var(--pri);color:var(--onpri);padding:12px 16px;position:sticky;top:0;z-index:5}
header button{background:none;border:0;color:inherit;font-size:22px;font-weight:800;letter-spacing:.3px;padding:4px 0}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;line-height:1.3;margin:8px 0}
h2{font-size:19px;margin:20px 0 8px}
.sub{color:var(--mut);margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 16px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-weight:600}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.chip[disabled]{opacity:.55;cursor:not-allowed}
.big{display:block;width:100%;min-height:72px;margin:10px 0;padding:14px 18px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:21px;font-weight:700}
.big small{display:block;font-size:15px;font-weight:400;color:var(--mut)}
.cta{display:block;width:100%;min-height:54px;margin-top:20px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-size:19px;font-weight:700}
.sec{min-height:50px;padding:8px 14px;border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:12px;font-weight:700}
.ghost{min-height:44px;padding:6px 12px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-size:15px;font-weight:600}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tm{font-weight:800;font-variant-numeric:tabular-nums;background:var(--hi);color:var(--hiink);padding:4px 10px;border-radius:8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.meta{font-size:14px;color:var(--mut)}
.q{font-size:20px;font-weight:600;margin:6px 0 14px;overflow-wrap:anywhere}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:54px;margin:8px 0;padding:10px 12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px}
.opt i{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.opt span{overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--pri);background:var(--skip)}
.opt.sel i{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok i{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad i{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.tag{font-size:13px;font-weight:700;margin-left:auto;white-space:nowrap;padding-left:6px}
.exp{margin-top:10px;padding:10px 12px;border-left:5px solid var(--pri);background:var(--skip);border-radius:6px}
.nav{display:flex;gap:8px}
.nav button{flex:1;min-height:52px;border:2px solid var(--pri);background:var(--card);color:var(--pri);border-radius:12px;font-weight:700}
.nav button[disabled]{opacity:.4;cursor:not-allowed}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pal button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--skip);font-weight:700}
.pal .a{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.pal .g{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.pal .r{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.pal .c{outline:3px solid var(--hi);outline-offset:1px}
.legend{font-size:14px;color:var(--mut);margin:8px 0}
.score{text-align:center}
.score b{display:block;font-size:56px;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{border-radius:12px;padding:10px 4px;text-align:center;font-weight:700}
.stats strong{display:block;font-size:26px}
.s1{background:var(--okbg);color:var(--ok)}.s2{background:var(--badbg);color:var(--bad)}.s3{background:var(--skip)}
.stack{display:grid;gap:10px;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal div{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%}
.modal .row{margin-top:14px}.modal .row button{flex:1}
[hidden]{display:none!important}
</style>
</head>

<header><button onclick="goHome()" aria-label="होम">Test Boards</button></header>
<main>
<section id="home" class="scr">
  <h1>बिहार बोर्ड MCQ प्रैक्टिस</h1>
  <p class="sub">बोर्ड और कक्षा चुनें, फिर विषय और चैप्टर से टेस्ट शुरू करें।</p>
  <h2>बोर्ड</h2>
  <div class="row"><button class="chip on">बिहार बोर्ड</button><button class="chip" disabled>अन्य बोर्ड – जल्द आएंगे</button></div>
  <h2>कक्षा</h2>
  <button class="big" onclick="pickClass(10)">10वीं (मैट्रिक)<small>विज्ञान, गणित, सामाजिक विज्ञान, हिंदी, English</small></button>
  <button class="big" onclick="pickClass(12)">12वीं<small>भौतिकी, रसायन, गणित</small></button>
</section>

<section id="setup" class="scr" hidden></section>
<section id="test" class="scr" hidden></section>
<section id="result" class="scr" hidden></section>
<section id="review" class="scr" hidden></section>
</main>
<div id="modal" class="modal" hidden><div><p id="mmsg" style="margin:0;font-size:18px"></p><div class="row"><button class="sec" onclick="mclose()">नहीं</button><button class="cta" style="margin:0" id="myes">हाँ</button></div></div></div>

["धारिता का SI मात्रक क्या है?",["हेनरी","फैराड","ओम","टेस्ला"],1,""]]
},
"रसायन विज्ञान":{
"विलयन":[
["मोलरता की इकाई क्या है?",["mol/kg","mol/L","g/L","mol"],1,"प्रति लीटर विलयन में विलेय के मोल।"],
["कौन-सा सांद्रता व्यक्त करने का तरीका ताप पर निर्भर नहीं करता?",["मोलरता","नॉर्मलता","मोललता","आयतन प्रतिशत"],2,"मोललता द्रव्यमान पर आधारित है।"],
["वाष्प दाब के आपेक्षिक अवनमन से संबंधित नियम कौन-सा है?",["राउल्ट का नियम","हेनरी का नियम","बॉयल का नियम","चार्ल्स का नियम"],0,""],
["हेनरी का नियम किससे संबंधित है?",["द्रव में गैस की विलेयता","क्वथनांक का उन्नयन","हिमांक का अवनमन","ठोस की विलेयता"],0,""],
["परासरण दाब का मात्रक कौन-सा हो सकता है?",["पास्कल","कूलॉम","ओम","फैराड"],0,""]]
},
"गणित":{
"अवकलन":[
["d/dx (x²) = ?",["x","2x","x²","2"],1,""],
["d/dx (sin x) = ?",["cos x","−cos x","−sin x","tan x"],0,""],
["d/dx (eˣ) = ?",["xeˣ⁻¹","eˣ","e","1"],1,""],
["d/dx (ln x) = ?",["x","1/x","ln x","eˣ"],1,""],
["किसी अचर राशि का अवकलज क्या होता है?",["1","0","अचर","अनंत"],1,""],
["d/dx (cos x) = ?",["sin x","−sin x","cos x","−cos x"],1,""]]
}}};

// ===== स्थिति =====
const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S={cls:0,subj:"",chap:"all",mode:"practice",count:10,src:[],qs:[],ans:[],cur:0,left:0,tid:null,live:false};
function show(n){document.querySelectorAll(".scr").forEach(e=>e.hidden=e.id!==n);window.scrollTo(0,0)}
function ask(msg,yes){$("#mmsg").textContent=msg;$("#modal").hidden=false;$("#myes").onclick=()=>{mclose();yes()}}
function mclose(){$("#modal").hidden=true}
function stop(){clearInterval(S.tid);S.tid=null}

// ===== होम और सेटअप =====
function goHome(){if(S.live){ask("टेस्ट बीच में छोड़ें? अभी तक के उत्तर सेव नहीं होंगे।",()=>{S.live=false;stop();show("home")})}else{stop();show("home")}}
function pickClass(c){S.cls=c;S.subj=Object.keys(BANK[c])[0];S.chap="all";S.mode="practice";renderSetup();show("setup")}
function pool(){const s=BANK[S.cls][S.subj];const ch=S.chap==="all"?Object.keys(s):[S.chap];return ch.flatMap(c=>s[c].map(x=>({q:x[0],o:x[1],a:x[2],e:x[3],ch:c})))}
const chip=(t,on,fn)=>`<button class="chip${on?" on":""}" onclick="${fn}">${t}</button>`;
function renderSetup(){
  const subs=Object.keys(BANK[S.cls]),chs=Object.keys(BANK[S.cls][S.subj]),n=pool().length;
  if(S.count>n)S.count=0;
  $("#setup").innerHTML=`<button class="ghost" onclick="show('home')">← वापस</button>
  <h1>कक्षा ${S.cls}वीं – टेस्ट सेटअप</h1>
  <h2>विषय</h2><div class="row">${subs.map(s=>chip(s,s===S.subj,`setSubj('${s}')`)).join("")}</div>
  <h2>चैप्टर</h2><div class="row">${chip("सभी चैप्टर",S.chap==="all","setChap('all')")}${chs.map(c=>chip(c,c===S.chap,`setChap('${c}')`)).join("")}</div>
  <h2>मोड</h2><div class="row">${chip("प्रैक्टिस (तुरंत उत्तर)",S.mode==="practice","setMode('practice')")}${chip("मॉक टेस्ट (टाइमर)",S.mode==="test","setMode('test')")}</div>
  <h2>प्रश्नों की संख्या</h2><div class="row">${[5,10,20].filter(k=>k<n).map(k=>chip(k,S.count===k,`setCount(${k})`)).join("")}${chip("सभी ("+n+")",S.count===0,"setCount(0)")}</div>
  <p class="sub" style="margin-top:12px">${S.mode==="test"?"मॉक टेस्ट में हर प्रश्न के लिए 1 मिनट मिलेगा और नतीजा अंत में दिखेगा।":"प्रैक्टिस में उत्तर चुनते ही सही/गलत और व्याख्या दिखेगी।"}</p>
  <button class="cta" onclick="startTest()">टेस्ट शुरू करें</button>`}
function setSubj(s){S.subj=s;S.chap="all";renderSetup()}
function setChap(c){S.chap=c;renderSetup()}
function setMode(m){S.mode=m;renderSetup()}
function setCount(k){S.count=k;renderSetup()}

// ===== टेस्ट =====
function startTest(){S.src=pool();S.n=S.count||S.src.length;draw()}
function draw(){
  const items=shuf(S.src).slice(0,S.n);
  S.qs=items.map(x=>({...x,opts:shuf(x.o.map((t,i)=>({t,ok:i===x.a})))}));
  S.ans=S.qs.map(()=>-1);S.cur=0;S.live=true;stop();
  if(S.mode==="test"){S.left=S.qs.length*60;S.tid=setInterval(()=>{S.left--;updTm();if(S.left<=0)finish()},1000)}
  renderTest();show("test")}
function updTm(){const e=$("#tm");if(!e)return;const m=Math.max(0,Math.floor(S.left/60)),s=Math.max(0,S.left%60);e.textContent="⏱ "+m+":"+String(s).padStart(2,"0")}
function pick(i){if(S.mode==="practice"&&S.ans[S.cur]>=0)return;S.ans[S.cur]=i;renderTest()}
function clr(){S.ans[S.cur]=-1;renderTest()}
function go(i){S.cur=Math.min(S.qs.length-1,Math.max(0,i));renderTest()}
function renderTest(){
  const q=S.qs[S.cur],n=S.qs.length,a=S.ans[S.cur],prac=S.mode==="practice",lock=prac&&a>=0;
  const opts=q.opts.map((o,i)=>{let c="opt";if(lock){if(o.ok)c+=" ok";else if(i===a)c+=" bad"}else if(i===a)c+=" sel";
    const tg=lock?(o.ok?"✓ सही":(i===a?"✗ आपका उत्तर":"")):"";
    return `<button class="${c}" onclick="pick(${i})"><i>${"ABCD"[i]}</i><span>${o.t}</span><em class="tag">${tg}</em></button>`}).join("");
  const pal=S.qs.map((x,i)=>{let c="";if(S.ans[i]>=0){c=prac?(x.opts[S.ans[i]].ok?"g":"r"):"a"}if(i===S.cur)c+=" c";return `<button class="${c}" onclick="go(${i})" aria-label="प्रश्न ${i+1}">${i+1}</button>`}).join("");
  const done=S.ans.filter(x=>x>=0).length;
  $("#test").innerHTML=`<div class="bar"><b>प्रश्न ${S.cur+1} / ${n}</b>${prac?"":'<span id="tm" class="tm"></span>'}<button class="ghost" onclick="reshuffle()">🔀 प्रश्न बदलें</button></div>
  <div class="card"><div class="meta">${S.subj} – ${q.ch}</div><p class="q">${q.q}</p>${opts}
  ${lock&&q.e?`<div class="exp"><b>व्याख्या:</b> ${q.e}</div>`:""}</div>
  <div class="nav"><button onclick="go(S.cur-1)" ${S.cur===0?"disabled":""}>← पिछला</button>${!prac&&a>=0?'<button onclick="clr()">उत्तर हटाएँ</button>':""}<button onclick="go(S.cur+1)" ${S.cur===n-1?"disabled":""}>अगला →</button></div>
  <h2>प्रश्न सूची (${done}/${n} हल)</h2><div class="pal">${pal}</div>
  <div class="legend">${prac?"हरा = सही, लाल = गलत, ग्रे = बाकी":"नीला = उत्तर दिया, ग्रे = बाकी"}. पीला घेरा = अभी का प्रश्न।</div>
  <button class="cta" onclick="trySubmit()">टेस्ट जमा करें</button>`;
  updTm()}
function reshuffle(){const any=S.ans.some(x=>x>=0);const f=()=>draw();any?ask("नए सवाल/नया क्रम लोड होगा और अभी के उत्तर मिट जाएंगे। जारी रखें?",f):f()}
function trySubmit(){const u=S.ans.filter(x=>x<0).length;ask(u?`${u} प्रश्न बाकी हैं। फिर भी जमा करें?`:"टेस्ट जमा करें?",finish)}

// ===== रिज़ल्ट =====
function stat(){let c=0,w=0,u=0;S.qs.forEach((q,i)=>{const a=S.ans[i];if(a<0)u++;else if(q.opts[a].ok)c++;else w++});return{c,w,u}}
function finish(){
  stop();S.live=false;const{c,w,u}=stat(),n=S.qs.length,p=Math.round(c*100/n);
  const msg=p>=80?"शानदार प्रदर्शन!":p>=50?"अच्छा प्रयास, थोड़ा और अभ्यास करें।":"और अभ्यास की ज़रूरत है, गलत सवाल दोबारा हल करें।";
  $("#result").innerHTML=`<div class="card score"><div class="meta">${S.subj} – ${S.chap==="all"?"सभी चैप्टर":S.chap}</div><b>${c} / ${n}</b><div style="font-size:22px;font-weight:700">${p}%</div><p class="sub">${msg}</p></div>
  <div class="stats"><div class="s1"><strong>${c}</strong>सही</div><div class="s2"><strong>${w}</strong>गलत</div><div class="s3"><strong>${u}</strong>छोड़े गए</div></div>
  <div class="stack"><button class="cta" style="margin:0" onclick="rv('all')">सभी उत्तर और व्याख्या देखें</button>
  ${w+u?'<button class="sec" onclick="retryWrong()">केवल गलत/छोड़े गए सवाल दोबारा हल करें</button>':""}
  <button class="sec" onclick="draw()">नया सेट (फिर से शफल)</button>
  <button class="sec" onclick="renderSetup();show('setup')">विषय/चैप्टर बदलें</button>
  <button class="sec" onclick="show('home')">होम</button></div>`;
  show("result")}
function retryWrong(){
  const items=S.qs.filter((q,i)=>S.ans[i]<0||!q.opts[S.ans[i]].ok);
  S.src=items;S.n=items.length;S.mode="practice";draw()}
function rv(f){
  const rows=S.qs.map((q,i)=>({q,i,a:S.ans[i]})).filter(r=>f==="all"||(f==="w"&&r.a>=0&&!r.q.opts[r.a].ok)||(f==="u"&&r.a<0)||(f==="c"&&r.a>=0&&r.q.opts[r.a].ok));
  const fl=[["all","सभी"],["c","सही"],["w","गलत"],["u","छोड़े गए"]].map(x=>chip(x[1],f===x[0],`rv('${x[0]}')`)).join("");
  const body=rows.length?rows.map(({q,i,a})=>`<div class="card"><div class="meta">प्रश्न ${i+1} – ${q.ch}</div><p class="q">${q.q}</p>
  ${q.opts.map((o,k)=>{let c="opt",t="";if(o.ok){c+=" ok";t="✓ सही उत्तर"}else if(k===a){c+=" bad";t="✗ आपका उत्तर"}return `<div class="${c}"><i>${"ABCD"[k]}</i><span>${o.t}</span><em class="tag">${t}</em></div>`}).join("")}
  ${a<0?'<div class="meta">आपने यह प्रश्न छोड़ा था।</div>':""}${q.e?`<div class="exp"><b>व्याख्या:</b> ${q.e}</div>`:""}</div>`).join(""):'<p class="sub">इस श्रेणी में कोई प्रश्न नहीं है।</p>';
  $("#review").innerHTML=`<button class="ghost" onclick="show('result')">← रिज़ल्ट पर वापस</button><h1>उत्तर समीक्षा</h1><div class="row" style="margin-bottom:12px">${fl}</div>${body}`;
  show("review")}
</script>
</body>
</html>
